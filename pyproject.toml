[project]
name = "customer-support-api"
version = "1.0.0"
description = "Agentic Customer Support System — Category 1: FastAPI Tool APIs over the commerce DB."
requires-python = ">=3.11"
dependencies = [
    # ---- Web / API ----
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    # ---- Database (async SQLAlchemy 2.0; SQLite now, Postgres-portable) ----
    "SQLAlchemy[asyncio]>=2.0.30",
    "greenlet>=3.0",
    "aiosqlite>=0.20",
    # For PostgreSQL deployment, add: "asyncpg>=0.29"  (see README "Portability")
]

[dependency-groups]
# Installed by `uv sync` (dev deps). Use `uv sync --no-dev` for a runtime-only env.
dev = [
    "httpx>=0.27",          # ASGI transport test client
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

# NOTE: Category 2 (the LangGraph agent) is a later phase; its deps
# (langgraph, langchain-anthropic, ...) will be added then.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
